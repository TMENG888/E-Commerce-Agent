<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的收藏 - 选品分析决策系统</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <nav class="navbar">
            <div class="nav-left">
                <div class="nav-brand">
                    <span class="brand-icon">💎</span>
                    <span class="brand-text">潜力商品收藏系统</span>
                </div>
            </div>
            <div class="nav-right">
                <div class="nav-links">
                    <a href="index.html" class="nav-link" id="nav-home">
                        <i class="fas fa-chart-line"></i>
                        <span>选品中心</span>
                    </a>
                    <a href="favorites.html" class="nav-link active" id="nav-favorites">
                        <i class="fas fa-heart"></i>
                        <span>我的收藏</span>
                    </a>
                </div>
            </div>
        </nav>

        <div class="favorites-section" style="display: block;">
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>商品信息</th>
                            <th>单价</th>
                            <th>想要人数</th>
                            <th width="200">货源链接</th>
                            <th>上架状态</th>
                            <th>备注</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="favorites-body">
                    </tbody>
                </table>
            </div>
        </div>

        <footer>
            <p>© 2024 商品热度分析系统 · 数据驱动决策</p>
        </footer>
    </div>
    <script src="script.js"></script>
    <script>
        // 页面加载即刷新收藏列表
        document.addEventListener('DOMContentLoaded', loadFavorites);
    </script>
</body>
</html>
