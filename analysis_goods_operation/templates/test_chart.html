<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head>
<body>
    <div id="test-chart" style="width: 400px; height: 300px;"></div>
    <script>
        var data = [{
            x: ['A', 'B', 'C'],
            y: [10, 20, 30],
            type: 'bar'
        }];
        var layout = {title: 'Test Chart'};
        Plotly.newPlot('test-chart', data, layout);
    </script>
</body>
</html>
